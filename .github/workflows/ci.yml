name: CI

on:
  push:
    branches:
      - "master"
      - "dev"
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: format (ubuntu)
            runs-on: ubuntu-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ruff format --check --diff src tests
          - task: format (macos)
            runs-on: macos-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ruff format --check --diff src tests
          - task: format (windows)
            runs-on: windows-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ruff format --check --diff src tests
          - task: ruff (ubuntu)
            runs-on: ubuntu-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ruff check src tests --output-format=github
          - task: ruff (macos)
            runs-on: macos-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ruff check src tests --output-format=github
          - task: ruff (windows)
            runs-on: windows-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ruff check src tests --output-format=github
          - task: ty (ubuntu)
            runs-on: ubuntu-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ty check src tests
          - task: ty (macos)
            runs-on: macos-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ty check src tests
          - task: ty (windows)
            runs-on: windows-latest
            do_sync: true
            docs: false
            command: uv run --no-sync ty check src tests
          - task: lockfile
            runs-on: ubuntu-latest
            do_sync: false
            docs: false
            command: uv lock --check
          - task: docs
            runs-on: ubuntu-latest
            do_sync: true
            docs: true
            command: uv run --no-sync python scripts/docs_prebuild.py && uv run --no-sync zensical build --clean
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install project dependencies
        if: matrix.do_sync && !matrix.docs
        run: uv sync --frozen --no-install-project

      - name: Install docs dependencies
        if: matrix.docs
        run: uv sync --frozen --no-install-project --group docs

      - name: Run check
        env:
          PYTHONUTF8: "1"
        run: ${{ matrix.command }}

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Add coverage to summary
        if: ${{ always() && matrix.python-version == '3.14' }}
        run: |
          {
            echo "## Coverage"
            echo ""
            uv run --no-sync python -m coverage report || true
          } >> "$GITHUB_STEP_SUMMARY"


  test-cross-os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --no-sync pytest tests/ -q --no-cov

      # Coverage gate on Linux only (single source of truth, not triple-counted).
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync pytest tests/ -q --cov=untether --cov-branch --cov-report=term-missing --cov-fail-under=81

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build (wheel + sdist)
        run: uv build

      - name: Inspect with twine and check-wheel-contents
        run: |
          uvx twine check dist/*
          uvx check-wheel-contents dist/*.whl

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Packages
          path: dist/
          if-no-files-found: error

  install-test:
    name: install-test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"

      - name: Install wheel in clean venv
        run: |
          uv venv /tmp/clean-env
          uv pip install --python /tmp/clean-env/bin/python dist/*.whl

      - name: Smoke-test imports and command backends
        run: |
          /tmp/clean-env/bin/python -c "
          from untether.commands import get_command, list_command_ids
          from untether.telegram.render import render_markdown
          from untether.runners.claude import BACKEND as claude_backend
          from untether.runners.codex import BACKEND as codex_backend
          from untether.runners.opencode import BACKEND as opencode_backend
          from untether.runners.pi import BACKEND as pi_backend
          from untether.runners.gemini import BACKEND as gemini_backend
          from untether.runners.amp import BACKEND as amp_backend
          from untether.runners.omp import BACKEND as omp_backend
          from untether.runners.grok import BACKEND as grok_backend
          from untether.runners.agy import BACKEND as agy_backend
          from untether.settings import load_settings
          command_ids = list_command_ids()
          assert 'health' in command_ids
          for command_id in command_ids:
              assert get_command(command_id).id == command_id
          print('All imports and command backends OK')
          "

  testpypi-publish:
    name: Publish to TestPyPI
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [build, pytest]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/untether
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing to TestPyPI
    steps:
      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  security:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: pip-audit
            do_sync: true
            command: uv run --no-sync pip-audit --skip-editable --progress-spinner=off --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357  # CVE-2026-4539 pygments (fixed in 2.20.0 lockfile bump #402); CVE-2026-3219 + CVE-2026-6357 pip itself, fix in pip 26.1 not yet pulled by uv tooling
            sync_args: ""
          - task: bandit
            do_sync: true
            command: uv run --no-sync bandit -r src/ -c pyproject.toml -q
            sync_args: --no-install-project
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        if: matrix.do_sync
        run: uv sync --frozen ${{ matrix.sync_args }}

      - name: Run check
        run: ${{ matrix.command }}

  release-validation:
    name: release-validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if version changed
        id: version-check
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:pyproject.toml | python3 -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])")
          PR_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$BASE_VERSION" != "$PR_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $BASE_VERSION -> $PR_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged: $PR_VERSION"
          fi

      - name: Validate release metadata
        if: steps.version-check.outputs.changed == 'true'
        run: python3 scripts/validate_release.py
